<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クライングシティ - キャラクターシート制作</title>
    <style>
        /* --- 基本設定 & ディストピア風カラー --- */
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #161a22;
            --accent-color: #ff3b30;
            --accent-gray: #b3bac2;  
            --accent-blue: #00bcd4;
            --accent-purple: #9d4edd;
            --accent-orange: #ff9500;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #2d3748;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 120px;
            opacity: 0;
            animation: fadeInPage 0.6s ease-out forwards;
        }

        @keyframes fadeInPage {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        header {
            background: linear-gradient(180deg, #11141a 0%, var(--panel-bg) 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }

        .container { max-width: 750px; margin: 0 auto; padding: 20px; }

        .section-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.1rem;
            color: #fff;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 15px;
            letter-spacing: 0.05em;
        }

        /* --- ナビゲーション戻るボタン --- */
        .back-nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .btn-nav {
            background-color: #222733; color: #fff; padding: 10px 15px; text-decoration: none;
            border-radius: 4px; font-size: 0.85rem; border: 1px solid var(--border-color); transition: 0.3s;
        }
        .btn-nav:hover { background-color: #2d3446; border-color: var(--accent-gray); }

        /* --- 技術能力スライド --- */
        .skill-carousel-slide { display: none; }
        .skill-carousel-slide.active { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        
        .skill-slide-nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #11141c; padding: 10px; border-radius: 6px;
            margin-bottom: 15px; border: 1px solid var(--border-color);
        }
        .btn-slide-arrow {
            background-color: #1f2430; color: var(--accent-blue); border: 1px solid var(--border-color);
            padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s;
            font-size: 0.8rem; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-slide-arrow:hover:not(:disabled) { background-color: #2d3548; box-shadow: 0 0 8px rgba(0,188,212,0.3); }
        .slide-indicator { font-size: 0.85rem; font-weight: bold; color: #fff; letter-spacing: 0.05em; text-align: center; }

        /* --- 入力フォーム基本 --- */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.span-2 { grid-column: span 2; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: bold; }
        
        input[type="text"], input[type="number"], select, textarea {
            background-color: #0d0f12; border: 1px solid var(--border-color); color: #fff;
            padding: 10px; border-radius: 4px; font-size: 0.9rem; outline: none; width: 100%;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }

        .status-header-bar {
            display: flex; justify-content: space-between; background-color: #11141c;
            padding: 8px 12px; border-radius: 4px; margin-bottom: 15px; font-size: 0.85rem;
            font-weight: bold; border: 1px solid #232d3f;
        }
        .stat-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #1f2733; gap: 10px;
        }
        .stat-name { font-weight: bold; font-size: 0.95rem; white-space: nowrap; }
        .stat-control { display: flex; align-items: center; gap: 8px; }
        .stat-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .btn-calc {
            background-color: #1f2430; color: #fff; border: 1px solid var(--border-color);
            width: 32px; height: 32px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1rem;
        }
        .btn-calc:hover:not(:disabled) { background-color: #2d3548; border-color: var(--accent-blue); }

        /* --- 動的カード（武器・前職・カスタムアビリティ） --- */
        .dynamic-card {
            background-color: #0d0f12; border: 1px solid var(--border-color);
            border-radius: 6px; padding: 15px; margin-bottom: 15px; position: relative;
        }
        .btn-delete-card {
            position: absolute; top: 10px; right: 10px; background-color: #331c20;
            color: #ff4444; border: 1px solid #552222; padding: 4px 10px; font-size: 0.75rem;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .btn-delete-card:hover { background-color: #ff4444; color: #fff; }
        .btn-add-card {
            background-color: #1c2d22; color: #34c759; border: 1px solid #2c4a34;
            padding: 8px 16px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-weight: bold; margin-top: 5px;
        }
        .btn-add-card:hover { background-color: #34c759; color: #0d0f12; }

        /* 称号バッジ */
        .title-badge-box {
            background-color: #11151d; border: 1px solid var(--accent-purple);
            padding: 12px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; text-align: center; color: #fff; margin-bottom: 15px;
            text-shadow: 0 0 6px var(--accent-purple);
        }

        /* --- バックストーリー開閉用 --- */
        .story-accordion { background-color: #11141b; border: 1px solid var(--border-color); border-radius: 6px; margin-top: 10px; }
        .story-summary { padding: 12px 15px; color: var(--accent-blue); font-weight: bold; cursor: pointer; font-size: 0.95rem; outline: none; }
        .story-summary:hover { background-color: #19202c; }
        .story-content { padding: 15px; border-top: 1px solid var(--border-color); background-color: var(--panel-bg); }

        /* --- 保存・共有枠 --- */
        .account-box { background: linear-gradient(135deg, #1a1525 0%, #111b24 100%); border: 1px solid var(--accent-blue); }
        .action-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .btn-action-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-action {
            background-color: var(--accent-blue); color: #0d0f12; border: none; padding: 12px;
            border-radius: 4px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center; transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(0,188,212,0.4); }
        .btn-save { background-color: var(--accent-color); color: #fff; }
        .btn-save:hover { box-shadow: 0 0 10px rgba(255,59,48,0.4); }
        .btn-ccfolia { background-color: var(--accent-purple); color: #fff; width: 100%; display: block; margin-top: 2px;}

        .share-url-box { margin-top: 15px; background-color: #0d0f12; padding: 10px; border-radius: 4px; border: 1px dashed var(--border-color); display: none; }
        .share-url-text { font-size: 0.85rem; color: var(--accent-blue); word-break: break-all; user-select: all; font-family: monospace; }

        .closet-box { background-color: #11141b; border: 1px solid #334155; }
        .closet-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .closet-item { display: flex; justify-content: space-between; align-items: center; background-color: #1c2331; padding: 10px 15px; border-radius: 4px; border: 1px solid var(--border-color); }
        .closet-item:hover { border-color: var(--accent-blue); background-color: #232c3d; }
        .closet-info { cursor: pointer; flex-grow: 1; }
        .closet-name { font-weight: bold; font-size: 0.95rem; color: #fff; }
        .closet-meta { font-size: 0.75rem; color: var(--text-muted); }
        .btn-delete-char { background-color: #331c20; color: #ff4444; border: 1px solid #552222; padding: 4px 10px; font-size: 0.75rem; border-radius: 4px; }
        .no-data-msg { font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 15px 0; }

        /* --- 目次 --- */
        .floating-menu {
            position: fixed; right: 20px; bottom: 20px; z-index: 2147483647; display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto;
        }
        .menu-trigger-btn {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #008ba3 100%);
            color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 56px; height: 56px; border-radius: 50%;
            font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,188,212,0.4); transition: transform 0.2s;
        }
        .menu-trigger-btn:hover { transform: scale(1.08); }
        .menu-content-panel {
            position: absolute; right: 0; bottom: 70px; width: 260px; max-height: 70vh; overflow-y: auto;
            background-color: #0e1117; border: 1px solid var(--accent-blue); border-radius: 8px; padding: 10px; display: none;
            box-shadow: 0 4px 25px rgba(0,0,0,0.9); animation: menuFade 0.2s ease-out forwards;
        }
        @keyframes menuFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .menu-content-panel .menu-section-title { font-size: 0.75rem; color: var(--accent-orange); font-weight: bold; padding: 4px 8px; border-bottom: 1px solid #2d3748; margin-top: 6px; }
        .menu-content-panel a { display: block; color: #cbd5e1; padding: 6px 12px; text-decoration: none; font-size: 0.85rem; border-radius: 4px; transition: all 0.15s; cursor: pointer; }
        .menu-content-panel a:hover { background-color: #1e293b; color: var(--accent-blue); padding-left: 16px; }
    </style>
</head>
<body onpageshow="if (event.persisted) window.location.reload();">

<div class="container" id="sheet-app">

    <div class="back-nav">
        <a href="index.html" class="btn-nav">➔ 概要ページへ戻る</a>
    </div>

    <!-- ==================== 1. システム・出力 ==================== -->
    <div class="section-panel account-box" id="sec-system">
        <h2>◆ システム・セーブ＆出力プロトコル</h2>
        <div class="form-grid" style="margin-top: 10px; gap:10px;">
            <div class="form-group">
                <label>セーブスロット名</label>
                <input type="text" id="slot-name" value="デフォルト of 市民データ">
            </div>
            <div class="form-group">
                <label>PL名（ココフォリア出力用）</label>
                <input type="text" id="p-pl-name" placeholder="プレイヤー名">
            </div>
        </div>
        <div class="action-container">
            <div class="btn-action-row">
                <button class="btn-action btn-save" onclick="saveToLocal()">💾 ブラウザへ保存</button>
                <button class="btn-action" onclick="generateShareLink()">🔗 公開URL生成</button>
            </div>
            <button class="btn-action btn-ccfolia" onclick="copyToCcfolia()">🔮 ココフォリア用データをコピー</button>
        </div>
        <div class="share-url-box" id="share-box">
            <label style="color: var(--accent-blue);">▼ 外部公開用共有URL</label>
            <div class="share-url-text" id="share-url"></div>
        </div>
    </div>

    <!-- ==================== 2. プロフィール ==================== -->
    <div class="section-panel" id="sec-profile">
        <h2>〇 プロフィール ＆ 経歴管理</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>名前 (PC名)</label>
                <input type="text" id="p-name" placeholder="名無しの市民">
            </div>
            <div class="form-group">
                <label>キャラクターレベル</label>
                <input type="number" id="p-level" value="1" min="1" oninput="recalculate()">
            </div>
            <div class="form-group">
                <label>所属会社（現在）</label>
                <select id="p-faction" onchange="updateFactionAndTraits()"></select>
            </div>
            <div class="form-group span-2" id="faction-free-group" style="display:none;">
                <label>自由記入所属組織名</label>
                <input type="text" id="p-faction-free" oninput="updateFactionAndTraits()">
            </div>
            <div class="form-group span-2" style="border-top:1px dashed var(--border-color); padding-top:10px;">
                <label style="color: var(--accent-blue);">▼ 前職の経歴</label>
                <div id="career-history-area"></div>
                <button type="button" class="btn-add-card" onclick="addNewCareerField()">＋ 前職の経歴を追加</button>
            </div>

            <div class="form-group span-2" style="border-top:1px dashed var(--border-color); padding-top:10px;">
                <label style="color: var(--accent-purple);">🏅 カスタム称号</label>
                <div class="title-badge-box" id="calc-full-title">【未設定】</div>
                <div class="form-grid" style="gap:10px;">
                    <div class="form-group"><label>前半選択</label><select id="p-title-prefix" onchange="combineTitles()"></select></div>
                    <div class="form-group"><label>後半選択</label><select id="p-title-suffix" onchange="combineTitles()"></select></div>
                    <div class="form-group"><input type="text" id="input-new-prefix" placeholder="新規前半フレーズ"><button type="button" class="btn-add-card" onclick="addNewTitleWord('prefix')">獲得</button></div>
                    <div class="form-group"><input type="text" id="input-new-suffix" placeholder="新規後半フレーズ"><button type="button" class="btn-add-card" onclick="addNewTitleWord('suffix')">獲得</button></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 3. 基礎能力 ==================== -->
    <div class="section-panel" id="sec-base">
        <h2>〇 基礎能力</h2>
        <div id="base-stats-rows-container"></div>
    </div>

    <!-- ==================== 4. 技術能力 ==================== -->
    <div class="section-panel" id="sec-skills">
        <h2>〇 技術能力</h2>
        <div id="skills-slides-track"></div>
        <div id="custom-skills-area"></div>
        <button type="button" class="btn-add-card" onclick="addNewCustomSkillField()">＋ カスタム技術能力を追加</button>
    </div>

    <!-- ==================== 5. 特殊能力 ==================== -->
    <div class="section-panel" id="sec-traits">
        <h2>〇 特殊能力</h2>
        <div id="special-slots-container"></div>
    </div>

    <!-- ==================== 6. 所持武器管理 ==================== -->
    <div class="section-panel" id="sec-weapons">
        <h2>〇 所持武器管理</h2>
        <div id="weapons-list-area"></div>
        <button type="button" class="btn-add-card" onclick="addNewWeaponField()">＋ 新しい武器を追加</button>
    </div>

    <!-- ==================== 7. 通過シナリオ ==================== -->
    <div class="section-panel" id="sec-scenarios">
        <h2>〇 通過シナリオ履歴</h2>
        <div id="scenarios-list-area"></div>
        <button type="button" class="btn-add-card" onclick="addNewScenarioField()">＋ 通過シナリオを記録</button>
    </div>
    
    <!-- ==================== 8. ストーリー ==================== -->
    <div class="section-panel" id="sec-story">
        <h2>〇 ストーリー・メモ</h2>
        <textarea rows="5" style="width:100%;"></textarea>
    </div>

    <!-- ==================== 9. 保存リスト ==================== -->
    <div class="section-panel closet-box" id="sec-closet">
        <h2>📂 保存済み市民データ一覧</h2>
        <div id="closet-list-area"></div>
    </div>

</div>

<!-- 目次 -->
<div class="floating-menu">
    <button type="button" class="menu-trigger-btn" onclick="toggleFloatingMenu()">☰</button>
    <div class="menu-content-panel" id="floating-menu-panel">
        <div class="menu-section-title">▼ 制作シート内セクションジャンプ</div>
        <a onclick="scrollToSection('sec-system')">⚡ システム</a>
        <a onclick="scrollToSection('sec-profile')">👤 プロフィール</a>
        <a onclick="scrollToSection('sec-base')">📊 基礎能力</a>
        <a onclick="scrollToSection('sec-skills')">⚔️ 技術能力</a>
        <a onclick="scrollToSection('sec-traits')">🧬 特殊能力</a>
        <a onclick="scrollToSection('sec-weapons')">📦 所持武器管理</a>
        <a onclick="scrollToSection('sec-scenarios')">🎬 通過シナリオ</a>
        <a onclick="scrollToSection('sec-story')">📖 ストーリー</a>
    </div>
</div>

<script>
    // ... (前回のロジックと同期)

</script>
</body>
</html>
